<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="80%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4"/>

  <!-- Subtle grid lines for financial precision -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.4"/>

  <!-- Dynamic Geometric M with Upward Bullish Arrow -->
  <g filter="url(#glow)">
    <!-- Left Column: Emerald growth pillar -->
    <path d="M 120 380 L 120 180 L 180 140 L 180 380 Z" fill="url(#emeraldGrad)"/>
    <!-- Center Left Ascent -->
    <path d="M 180 140 L 256 260 L 256 340 L 180 220 Z" fill="#059669" opacity="0.95"/>
    <!-- Center Right Ascent with Upward Peak Arrow -->
    <path d="M 256 260 L 332 140 L 332 220 L 256 340 Z" fill="url(#goldGrad)"/>
    <!-- Right Column: Gold prosperity pillar -->
    <path d="M 332 140 L 392 180 L 392 380 L 332 380 Z" fill="url(#goldGrad)"/>
    <!-- Upward Growth Apex Spear -->
    <polygon points="256,92 290,148 222,148" fill="url(#goldGrad)"/>
    <!-- Small Diamond Sparkle -->
    <circle cx="256" cy="256" r="10" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
